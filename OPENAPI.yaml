openapi: 3.0.0
info:
  title: Book Store API
  description: A comprehensive REST API for managing an online bookstore with books, authors, customers, orders, and sales reports.
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Development server

tags:
  - name: Books
    description: Operations related to books
  - name: Authors
    description: Operations related to authors
  - name: Customers
    description: Customer registration, authentication, and management
  - name: Orders
    description: Order management and tracking
  - name: Reports
    description: Sales reports and analytics
  - name: Metrics
    description: System metrics and statistics

paths:
  /books:
    get:
      summary: Search and list books
      tags:
        - Books
      description: Search for books with optional filtering and sorting
      parameters:
        - name: title
          in: query
          description: Filter by book title (partial match)
          schema:
            type: string
        - name: author
          in: query
          description: Filter by author name (partial match)
          schema:
            type: string
        - name: genre
          in: query
          description: Filter by genre
          schema:
            type: string
        - name: min_price
          in: query
          description: Minimum price filter
          schema:
            type: number
            format: float
        - name: max_price
          in: query
          description: Maximum price filter
          schema:
            type: number
            format: float
        - name: sort_by
          in: query
          description: Field to sort by (e.g., title, price, published_at)
          schema:
            type: string
        - name: sort_order
          in: query
          description: Sort order (asc or desc)
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: List of books matching the criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create a new book
      tags:
        - Books
      description: Create a new book entry. Author must exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Author not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /books/{bookId}:
    get:
      summary: Get book by ID
      tags:
        - Books
      description: Retrieve a specific book by its ID
      parameters:
        - name: bookId
          in: path
          required: true
          description: The ID of the book to retrieve
          schema:
            type: integer
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update a book
      tags:
        - Books
      description: Update book information. Author must exist.
      parameters:
        - name: bookId
          in: path
          required: true
          description: The ID of the book to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
      responses:
        '200':
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Book or author not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete a book
      tags:
        - Books
      description: Delete a book by ID
      parameters:
        - name: bookId
          in: path
          required: true
          description: The ID of the book to delete
          schema:
            type: integer
      responses:
        '200':
          description: Book deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /authors:
    get:
      summary: List all authors
      tags:
        - Authors
      description: Retrieve a list of all authors
      responses:
        '200':
          description: List of all authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create a new author
      tags:
        - Authors
      description: Create a new author entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Author'
      responses:
        '201':
          description: Author created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /authors/{authorId}:
    get:
      summary: Get author by ID
      tags:
        - Authors
      description: Retrieve a specific author by their ID
      parameters:
        - name: authorId
          in: path
          required: true
          description: The ID of the author to retrieve
          schema:
            type: integer
      responses:
        '200':
          description: Author details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          description: Author not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update an author
      tags:
        - Authors
      description: Update author information
      parameters:
        - name: authorId
          in: path
          required: true
          description: The ID of the author to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Author'
      responses:
        '200':
          description: Author updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Author not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete an author
      tags:
        - Authors
      description: Delete an author by ID
      parameters:
        - name: authorId
          in: path
          required: true
          description: The ID of the author to delete
          schema:
            type: integer
      responses:
        '200':
          description: Author deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Author not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers/register:
    post:
      summary: Register a new customer
      tags:
        - Customers
      description: Create a new customer account and receive an authentication token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                address:
                  $ref: '#/components/schemas/Address'
      responses:
        '201':
          description: Customer registered successfully with token
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
                  token:
                    type: string
                    description: JWT authentication token
                  address:
                    $ref: '#/components/schemas/Address'
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Validation error (missing field or email already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /customers/login:
    post:
      summary: Login customer
      tags:
        - Customers
      description: Authenticate a customer and receive an authentication token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful with token
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
                  token:
                    type: string
                    description: JWT authentication token
                  address:
                    $ref: '#/components/schemas/Address'
                  created_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /customers:
    get:
      summary: List all customers
      tags:
        - Customers
      description: Retrieve a list of all customers (protected)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of all customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create a new customer
      tags:
        - Customers
      description: Create a new customer account (protected)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /customers/{customerId}:
    get:
      summary: Get customer by ID
      tags:
        - Customers
      description: Retrieve a specific customer by their ID (protected)
      security:
        - BearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          description: The ID of the customer to retrieve
          schema:
            type: integer
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update a customer
      tags:
        - Customers
      description: Update customer information (protected)
      security:
        - BearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          description: The ID of the customer to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a customer
      tags:
        - Customers
      description: Delete a customer by ID (protected)
      security:
        - BearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          description: The ID of the customer to delete
          schema:
            type: integer
      responses:
        '200':
          description: Customer deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders:
    get:
      summary: List or search orders
      tags:
        - Orders
      description: Retrieve orders with optional filtering by status or date range (protected)
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter orders by status (pending, completed, cancelled)
          schema:
            type: string
        - name: start_date
          in: query
          description: Start date for date range filter (ISO 8601 format)
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: End date for date range filter (ISO 8601 format)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Create a new order
      tags:
        - Orders
      description: Create a new order for the authenticated customer (protected)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderItem'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '408':
          description: Request timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}:
    get:
      summary: Get order by ID
      tags:
        - Orders
      description: Retrieve a specific order by its ID (protected)
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: The ID of the order to retrieve
          schema:
            type: integer
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update order status
      tags:
        - Orders
      description: Change the status of an order (protected)
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: The ID of the order to update
          schema:
            type: integer
        - name: status
          in: query
          required: true
          description: New order status
          schema:
            type: string
            enum: [completed, cancelled]
      responses:
        '200':
          description: Order status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reports/sales:
    get:
      summary: List sales reports
      tags:
        - Reports
      description: Retrieve sales reports with optional date filtering
      parameters:
        - name: since
          in: query
          description: Number of days ago to retrieve reports from
          schema:
            type: integer
      responses:
        '200':
          description: List of sales reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesReport'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Generate a new sales report
      tags:
        - Reports
      description: Generate a new sales report based on current orders
      responses:
        '201':
          description: Sales report generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReport'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reports/sales/latest:
    get:
      summary: Get latest sales report
      tags:
        - Reports
      description: Retrieve the most recent sales report
      responses:
        '200':
          description: Latest sales report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReport'
        '404':
          description: No reports available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /metrics:
    get:
      summary: Get system metrics
      tags:
        - Metrics
      description: Retrieve various system metrics based on query parameters
      parameters:
        - name: total_customers
          in: query
          description: Get total number of customers
          schema:
            type: string
        - name: total_books
          in: query
          description: Get total number of books
          schema:
            type: string
        - name: total_authors
          in: query
          description: Get total number of authors
          schema:
            type: string
        - name: out_of_stock_books
          in: query
          description: Get count of out of stock books
          schema:
            type: string
        - name: books_per_genre
          in: query
          description: Get number of books for a specific genre
          schema:
            type: string
        - name: genre
          in: query
          description: Genre name (required when books_per_genre is set)
          schema:
            type: string
        - name: books_per_author
          in: query
          description: Get count of books per author
          schema:
            type: string
      responses:
        '200':
          description: Metric value
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Unknown metric
          content:
            text/plain:
              schema:
                type: string

  /metrics/hits:
    get:
      summary: Get API hits metrics
      tags:
        - Metrics
      description: Retrieve API request metrics
      responses:
        '200':
          description: API hits metric
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    Book:
      type: object
      required:
        - title
        - author
        - price
        - stock
      properties:
        id:
          type: integer
          description: Unique book identifier
        title:
          type: string
          description: Title of the book
        author:
          $ref: '#/components/schemas/Author'
        genres:
          type: array
          items:
            type: string
          description: List of genres the book belongs to
        published_at:
          type: string
          format: date-time
          description: Publication date
        price:
          type: number
          format: double
          description: Book price
        stock:
          type: integer
          description: Number of copies in stock

    Author:
      type: object
      required:
        - first_name
        - last_name
      properties:
        id:
          type: integer
          description: Unique author identifier
        first_name:
          type: string
          description: Author's first name
        last_name:
          type: string
          description: Author's last name
        bio:
          type: string
          description: Author biography

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string

    Customer:
      type: object
      required:
        - name
        - email
        - password
      properties:
        id:
          type: integer
          description: Unique customer identifier
        name:
          type: string
          description: Customer's full name
        email:
          type: string
          format: email
          description: Customer's email address
        password:
          type: string
          format: password
          description: Customer's password (hashed in storage)
        address:
          $ref: '#/components/schemas/Address'
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp

    OrderItem:
      type: object
      required:
        - book
        - quantity
      properties:
        book:
          $ref: '#/components/schemas/Book'
        quantity:
          type: integer
          description: Quantity of this book in the order

    Order:
      type: object
      required:
        - customer
        - items
        - total_price
        - status
      properties:
        id:
          type: integer
          description: Unique order identifier
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          description: Items in the order
        total_price:
          type: number
          format: double
          description: Total price of the order
        created_at:
          type: string
          format: date-time
          description: Order creation timestamp
        status:
          type: string
          enum: [pending, completed, cancelled]
          description: Current status of the order

    BookSales:
      type: object
      properties:
        book:
          $ref: '#/components/schemas/Book'
        quantity:
          type: integer
          description: Number of copies sold

    SalesReport:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the report was generated
        total_revenue:
          type: number
          format: double
          description: Total revenue in the reporting period
        total_orders:
          type: integer
          description: Total number of orders
        top_selling_books:
          type: array
          items:
            $ref: '#/components/schemas/BookSales'
          description: List of top-selling books

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized - JWT token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /customers/register or /customers/login
